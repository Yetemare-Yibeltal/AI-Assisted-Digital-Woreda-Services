<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Grouping Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        fieldset {
            border: 2px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
            color: #333;
            padding: 0 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }

        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>User Registration Form</h2>
        
        <form action="#" method="post">
            <!-- Personal Information Group -->
            <fieldset>
                <legend>Personal Information</legend>
                
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
            </fieldset>

            <!-- Address Information Group -->
            <fieldset>
                <legend>Address Information</legend>
                
                <div class="form-group">
                    <label for="address">Street Address:</label>
                    <input type="text" id="address" name="address">
                </div>
                
                <div class="form-group">
                    <label for="city">City:</label>
                    <input type="text" id="city" name="city">
                </div>
                
                <div class="form-group">
                    <label for="country">Country:</label>
                    <select id="country" name="country">
                        <option value="">Select Country</option>
                        <optgroup label="North America">
                            <option value="us">United States</option>
                            <option value="ca">Canada</option>
                            <option value="mx">Mexico</option>
                        </optgroup>
                        <optgroup label="Europe">
                            <option value="uk">United Kingdom</option>
                            <option value="fr">France</option>
                            <option value="de">Germany</option>
                        </optgroup>
                        <optgroup label="Asia">
                            <option value="jp">Japan</option>
                            <option value="in">India</option>
                            <option value="cn">China</option>
                        </optgroup>
                    </select>
                </div>
            </fieldset>

            <!-- Account Settings Group -->
            <fieldset>
                <legend>Account Settings</legend>
                
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="newsletter">
                        Subscribe to newsletter
                    </label>
                </div>
                
                <div class="form-group">
                    <label>Notification Preferences:</label><br>
                    <label>
                        <input type="radio" name="notifications" value="email">
                        Email
                    </label>
                    <label>
                        <input type="radio" name="notifications" value="sms">
                        SMS
                    </label>
                    <label>
                        <input type="radio" name="notifications" value="both">
                        Both
                    </label>
                </div>
            </fieldset>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
